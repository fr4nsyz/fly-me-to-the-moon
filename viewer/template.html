<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descent Viewer</title>
<style>
:root {
  --bg: #111316;
  --panel: #15181c;
  --line: #2a2f36;
  --text: #e3e4e7;
  --muted: #8f959e;
  --clean: #3987e5;
  --faulty: #d95926;
  --good: #199e70;
  --cursor: #c9ccd1;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 1fr 200px 44px;
  grid-template-areas: "scene panel" "charts panel" "timeline timeline"; overflow: hidden;
}
#scene { grid-area: scene; position: relative; min-height: 0; }
#scene canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#scene canvas:active { cursor: grabbing; }
#overlay { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; }
#hint { position: absolute; bottom: 8px; left: 10px; color: var(--muted); font-size: 11px; }
#charts { grid-area: charts; display: flex; gap: 1px; background: var(--line); border-top: 1px solid var(--line); min-height: 0; }
#charts canvas { flex: 1; min-width: 0; height: 100%; background: var(--bg); }
#trial { width: 100%; margin-bottom: 6px; }
#panel { grid-area: panel; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; }
#timeline { grid-area: timeline; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); }
#scrub { flex: 1; accent-color: var(--cursor); }
#readout { font-family: var(--mono); min-width: 160px; text-align: right; color: var(--muted); }
button, select { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 2px; padding: 3px 9px; font: inherit; cursor: pointer; }
button.on { border-color: var(--cursor); }
button:hover { border-color: var(--muted); }
#play { width: 64px; }
section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.label { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.title { font-size: 13px; font-weight: 600; }
.sub { color: var(--muted); }
.outcome { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-weight: 600; letter-spacing: 0.04em; }
.sq { width: 10px; height: 10px; flex: none; }
.result { margin-top: 4px; color: var(--muted); }
.warn { margin-top: 8px; padding: 6px 8px; border-left: 2px solid var(--faulty); color: var(--text); }
.key { display: flex; gap: 14px; margin-top: 8px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 5px; }
.key i { display: inline-block; width: 14px; height: 2px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 2px 0; text-align: left; font-weight: 400; }
#telemetry th { color: var(--muted); padding-right: 6px; }
#telemetry td { font-family: var(--mono); text-align: right; }
#telemetry thead th { text-align: right; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
#telemetry thead th:first-child { text-align: left; }
#telemetry tr.diverged th { box-shadow: inset 2px 0 0 var(--faulty); padding-left: 6px; color: var(--text); }
#gauge { display: block; width: 100%; height: 150px; }
.computers { display: flex; gap: 16px; }
.computer { display: flex; align-items: center; gap: 6px; }
.computer .sq { background: var(--good); }
.computer.off .sq { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); }
.computer.off .state { color: var(--muted); }
.state { font-family: var(--mono); }
#events button { display: flex; width: 100%; justify-content: space-between; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 4px 0; text-align: left; }
#events button:hover { color: #fff; }
#events .t { font-family: var(--mono); color: var(--muted); }
#events button.past .what { color: var(--text); }
#events button.future .what { color: var(--muted); }
.fault td { font-family: var(--mono); word-break: break-all; }
.fault th { color: var(--muted); padding-right: 10px; white-space: nowrap; vertical-align: top; }
</style>
</head>
<body>
<div id="scene">
  <div id="overlay">
    <button data-exag="1" class="on">1x</button>
    <button data-exag="20">20x altitude</button>
    <span style="width:10px"></span>
    <button data-view="overview">Overview</button>
    <button data-view="touchdown">Touchdown</button>
  </div>
  <div id="hint">drag: orbit / shift-drag or right-drag: pan / wheel: zoom / space: play</div>
</div>
<div id="charts">
  <canvas id="chartAlt"></canvas>
  <canvas id="chartSpeed"></canvas>
</div>
<aside id="panel"></aside>
<div id="timeline">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" step="0.1" value="0">
  <span id="readout"></span>
  <select id="rate">
    <option value="1">1x</option>
    <option value="10">10x</option>
    <option value="30" selected>30x</option>
    <option value="100">100x</option>
  </select>
</div>
<script>/*@THREE@*/</script>
<script>const DATA = /*@DATA@*/;</script>
<script>
(function () {
"use strict";
const R = 1737400;
const hash = location.hash.slice(1).split("@");
const pick = Math.min(Math.max(0, Number(hash[0]) || 0), DATA.trials.length - 1);
const ev = DATA.trials[pick].evidence, faulty = DATA.trials[pick].faulty, clean = DATA.clean[ev.defense];

function finite(p) { return p && p.every(function (v) { return v !== null && isFinite(v); }); }
function norm(p) { return Math.hypot(p[0], p[1], p[2]); }
function scale(p, s) { return [p[0] * s, p[1] * s, p[2] * s]; }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function unit(p) { return scale(p, 1 / norm(p)); }
// Moon-fixed has z along the spin axis; the scene is y-up.
function toScene(p) { return [p[0], p[2], -p[1]]; }

const cleanEnd = clean.samples[clean.samples.length - 1];
const spot = clean.touchdown ? clean.touchdown.spot : cleanEnd.position;
// Floating origin: all geometry is relative to the clean touchdown, subtracted in 64-bit before reaching the GPU.
const O = toScene(spot);

function display(p, k) {
  const r = norm(p);
  return sub(toScene(scale(p, (R + k * (r - R)) / r)), O);
}

function firstVisible() {
  const n = Math.min(clean.samples.length, faulty.samples.length);
  for (let i = 0; i < n; ++i) {
    const a = clean.samples[i].position, b = faulty.samples[i].position;
    if (!finite(b) || a[0] !== b[0] || a[1] !== b[1] || a[2] !== b[2]) return i;
  }
  return clean.samples.length !== faulty.samples.length ? n : -1;
}
const divergeIndex = firstVisible();

function locate(samples, t) {
  let lo = 0, hi = samples.length - 1;
  if (t >= samples[hi].t) return { i: hi, f: 0 };
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (samples[mid].t <= t) lo = mid; else hi = mid;
  }
  return { i: lo, f: (t - samples[lo].t) / (samples[hi].t - samples[lo].t) };
}

const tMax = Math.max(cleanEnd.t, faulty.samples[faulty.samples.length - 1].t);
let tNow = 0, playing = false, exag = 1;

const sceneEl = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
sceneEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111316);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 3e7);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(0.4, 0.6, 0.7);
scene.add(sun);

const moonMat = new THREE.MeshLambertMaterial({ color: 0x8c8c88 });
// Sunk below the true surface so its facets stay under the exact local patch.
const moon = new THREE.Mesh(new THREE.SphereGeometry(R - 300, 256, 128), moonMat);
moon.position.set(-O[0], -O[1], -O[2]);
scene.add(moon);

const U0 = unit(toScene(spot));
function basis(up) {
  const e = unit(cross([0, 1, 0], up));
  return { U: up, E: e, N: cross(up, e) };
}
const B0 = basis(U0);

function surfacePatch(halfWidth, n) {
  const pos = [], idx = [];
  for (let j = 0; j <= 2 * n; ++j) {
    for (let i = 0; i <= 2 * n; ++i) {
      const e = (i - n) / n * halfWidth, nn = (j - n) / n * halfWidth;
      const dir = unit(add(add(B0.U, scale(B0.E, e / R)), scale(B0.N, nn / R)));
      const p = sub(scale(dir, R), O);
      pos.push(p[0], p[1], p[2]);
    }
  }
  const w = 2 * n + 1;
  for (let j = 0; j < 2 * n; ++j) {
    for (let i = 0; i < 2 * n; ++i) {
      const a = j * w + i;
      idx.push(a, a + w, a + 1, a + 1, a + w, a + w + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, moonMat);
}
scene.add(surfacePatch(150000, 150));

function ring(radius, color) {
  const pts = [];
  for (let i = 0; i <= 128; ++i) {
    const a = i / 128 * 2 * Math.PI;
    const dir = unit(add(add(B0.U, scale(B0.E, radius * Math.cos(a) / R)), scale(B0.N, radius * Math.sin(a) / R)));
    const p = sub(scale(dir, R + 0.5), O);
    pts.push(new THREE.Vector3(p[0], p[1], p[2]));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: color }));
}
scene.add(ring(1000, 0x8f959e));

function marker(color) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color: color }));
  scene.add(m);
  return m;
}
const cleanMarker = marker(0x3987e5), faultyMarker = marker(0xd95926), divergeMarker = marker(0xc9ccd1);
const markers = [cleanMarker, faultyMarker, divergeMarker];

let cleanPts = [], faultyPts = [], cleanLine = null, faultyLine = null;
function buildPath(samples, k, color, old) {
  if (old) { scene.remove(old); old.geometry.dispose(); }
  const pts = samples.map(function (s) { return finite(s.position) ? display(s.position, k) : null; });
  const v = pts.filter(Boolean).map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); });
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(v), new THREE.LineBasicMaterial({ color: color }));
  scene.add(line);
  return { pts: pts, line: line };
}
function buildPaths() {
  let r = buildPath(clean.samples, exag, 0x3987e5, cleanLine);
  cleanPts = r.pts; cleanLine = r.line;
  r = buildPath(faulty.samples, exag, 0xd95926, faultyLine);
  faultyPts = r.pts; faultyLine = r.line;
  const d = divergeIndex >= 0 && divergeIndex < faultyPts.length ? faultyPts[divergeIndex] : null;
  divergeMarker.visible = !!d;
  if (d) divergeMarker.position.set(d[0], d[1], d[2]);
}

function placeMarker(m, samples, pts, t) {
  const at = locate(samples, t);
  const a = pts[at.i], b = pts[Math.min(at.i + 1, pts.length - 1)];
  m.visible = !!(a && b);
  if (!m.visible) return;
  m.position.set(a[0] + (b[0] - a[0]) * at.f, a[1] + (b[1] - a[1]) * at.f, a[2] + (b[2] - a[2]) * at.f);
}

const orbit = { target: [0, 0, 0], B: B0, r: 2000, theta: 0, phi: 0.5 };
function applyOrbit() {
  const B = orbit.B, c = Math.cos(orbit.phi);
  const off = add(add(scale(B.E, c * Math.cos(orbit.theta) * orbit.r), scale(B.N, c * Math.sin(orbit.theta) * orbit.r)),
                  scale(B.U, Math.sin(orbit.phi) * orbit.r));
  const p = add(orbit.target, off);
  camera.position.set(p[0], p[1], p[2]);
  camera.up.set(B.U[0], B.U[1], B.U[2]);
  camera.lookAt(orbit.target[0], orbit.target[1], orbit.target[2]);
}

function setView(name) {
  const start = clean.samples[0].position;
  if (name === "overview") {
    const mid = unit(add(unit(toScene(start)), U0));
    orbit.B = basis(mid);
    orbit.target = sub(scale(mid, R + 4000 * exag), O);
    orbit.r = 1.25 * norm(sub(toScene(start), toScene(spot))) + 30000 * exag;
    orbit.theta = -Math.PI / 2;
    orbit.phi = 0.3;
  } else {
    let miss = 0;
    if (faulty.touchdown && finite(faulty.touchdown.spot)) miss = norm(sub(faulty.touchdown.spot, spot));
    orbit.B = B0;
    orbit.target = [0, 0, 0];
    orbit.r = Math.min(Math.max(2500, 3 * miss), 400000);
    orbit.theta = -Math.PI / 2 + 0.7;
    orbit.phi = 0.45;
  }
  document.querySelectorAll("[data-view]").forEach(function (b) { b.classList.toggle("on", b.dataset.view === name); });
  applyOrbit();
}

let drag = null;
renderer.domElement.addEventListener("contextmenu", function (e) { e.preventDefault(); });
renderer.domElement.addEventListener("pointerdown", function (e) {
  drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2 };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointerup", function () { drag = null; });
renderer.domElement.addEventListener("pointermove", function (e) {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    const s = orbit.r * 0.0015;
    orbit.target = add(orbit.target, [(-dx * right.x + dy * up.x) * s, (-dx * right.y + dy * up.y) * s, (-dx * right.z + dy * up.z) * s]);
  } else {
    orbit.theta -= dx * 0.005;
    orbit.phi = Math.min(1.55, Math.max(-1.2, orbit.phi + dy * 0.005));
  }
  applyOrbit();
});
renderer.domElement.addEventListener("wheel", function (e) {
  e.preventDefault();
  orbit.r = Math.min(2e7, Math.max(5, orbit.r * Math.exp(e.deltaY * 0.0015)));
  applyOrbit();
}, { passive: false });

document.querySelectorAll("[data-exag]").forEach(function (b) {
  b.addEventListener("click", function () {
    exag = Number(b.dataset.exag);
    document.querySelectorAll("[data-exag]").forEach(function (x) { x.classList.toggle("on", x === b); });
    buildPaths();
  });
});
document.querySelectorAll("[data-view]").forEach(function (b) {
  b.addEventListener("click", function () { setView(b.dataset.view); });
});

function fmt(v, d) { return v === null || v === undefined || !isFinite(v) ? "inf" : v.toFixed(d); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); }
function bitRegion(b) { return b === 63 ? "sign" : b >= 52 ? "exponent" : b >= 26 ? "high mantissa" : "low mantissa"; }

const OUTCOME = { MASKED: "#3987e5", CORRECTED: "#199e70", SDC: "#d95926", DETECTED: "#c98500", CRASH: "#9085e9", HANG: "#9085e9" };
const DRY_MASS = 7000;
const computerCount = ev.defense === "none" ? 1 : 3;
const allTrusted = (1 << computerCount) - 1;

function sampleAt(samples, t) {
  const at = locate(samples, t), a = samples[at.i], b = samples[Math.min(at.i + 1, samples.length - 1)];
  function mix(k) { return a[k] === null || b[k] === null ? null : a[k] + (b[k] - a[k]) * at.f; }
  const vs = mix("vertical_speed"), hs = mix("horizontal_speed");
  return {
    altitude: mix("altitude"), vs: vs, hs: hs,
    speed: vs === null || hs === null ? null : Math.hypot(vs, hs),
    angle: vs === null || hs === null ? null : Math.atan2(-vs, hs) * 180 / Math.PI,
    tilt: mix("thrust_tilt"), throttle: mix("throttle"),
    fuel: a.mass === null ? null : mix("mass") - DRY_MASS, computers: a.computers, ended: t > samples[samples.length - 1].t,
  };
}

const ROWS = [
  ["altitude", "Altitude (m)", 1, 0.5],
  ["vs", "Vertical speed (m/s)", 2, 0.01],
  ["hs", "Horizontal speed (m/s)", 2, 0.01],
  ["speed", "Speed (m/s)", 2, 0.01],
  ["angle", "Descent angle (deg)", 1, 0.05],
  ["tilt", "Thrust tilt (deg)", 1, 0.05],
  ["throttle", "Throttle (%)", 1, 0.05, 100],
  ["fuel", "Fuel (kg)", 1, 0.5],
];

function events() {
  const out = [];
  const brake = clean.samples.find(function (s) { return s.throttle !== null && s.throttle < 0.999; });
  if (brake) out.push({ t: brake.t, what: "Braking ends, final descent begins" });
  if (divergeIndex >= 0 && divergeIndex < faulty.samples.length) out.push({ t: faulty.samples[divergeIndex].t, what: "Fault changes the trajectory" });
  if (computerCount > 1) {
    const silenced = faulty.samples.find(function (s) { return s.computers !== allTrusted; });
    if (silenced) {
      const lost = [0, 1, 2].filter(function (c) { return !(silenced.computers & (1 << c)); });
      out.push({ t: silenced.t, what: "Computer " + lost.join(", ") + " silenced" });
    }
  }
  const ft = faulty.touchdown, fEnd = faulty.samples[faulty.samples.length - 1];
  if (!ft) out.push({ t: fEnd.t, what: "Faulty run: no touchdown before the time limit" });
  else if (ft.score === null || ft.score > 1) out.push({ t: ft.t, what: "Faulty run: impact at " + fmt(ft.descent, 1) + " m/s down" });
  else out.push({ t: ft.t, what: "Faulty run: touchdown at " + fmt(ft.descent, 1) + " m/s" });
  if (clean.touchdown) out.push({ t: clean.touchdown.t, what: "Clean run: touchdown" });
  return out.sort(function (a, b) { return a.t - b.t; });
}
const EVENTS = events();

function trialPicker() {
  const groups = {};
  DATA.trials.forEach(function (t, i) { (groups[t.evidence.sweep] = groups[t.evidence.sweep] || []).push(i); });
  return "<select id='trial'>" + Object.keys(groups).map(function (sweep) {
    return "<optgroup label='" + esc(sweep) + "'>" + groups[sweep].map(function (i) {
      const e = DATA.trials[i].evidence;
      return "<option value='" + i + "'" + (i === pick ? " selected" : "") + ">Trial " + e.trial + ", " + e.classification + "</option>";
    }).join("") + "</optgroup>";
  }).join("") + "</select>";
}

function buildPanel() {
  const ct = clean.touchdown, ft = faulty.touchdown;
  let miss = null;
  if (ct && ft && finite(ft.spot)) miss = norm(sub(ft.spot, ct.spot));
  const result = !ft ? "No touchdown before the time limit."
    : (ft.score === null || ft.score > 1 ? "Impact: " : "Landed: ") + fmt(ft.descent, 1) + " m/s down, " + fmt(ft.horizontal, 1) +
      " m/s sideways, " + fmt(miss, 0) + " m from the clean spot, score " + fmt(ft.score, 2) + " (pass at 1 or less).";
  const src = ev.file ? esc(ev.file) + ":" + ev.line : "unknown";
  document.getElementById("panel").innerHTML =
    "<section>" + trialPicker() + "<div class='sub'>" + esc(ev.sweep) + ", defense " + esc(ev.defense) + "</div>" +
    "<div class='outcome'><span class='sq' style='background:" + (OUTCOME[ev.classification] || "#8f959e") + "'></span>" + esc(ev.classification) + "</div>" +
    "<div class='result'>" + result + "</div>" +
    (ev.warning ? "<div class='warn'>" + esc(ev.warning) + "</div>" : "") +
    "<div class='key'><span><i style='background:var(--clean)'></i>clean</span><span><i style='background:var(--faulty)'></i>faulty</span></div></section>" +
    "<section><div class='label'>Telemetry at the current time</div><table id='telemetry'><thead><tr><th></th><th>clean</th><th>faulty</th><th>difference</th></tr></thead><tbody>" +
    ROWS.map(function (r) { return "<tr id='row-" + r[0] + "'><th>" + r[1] + "</th><td></td><td></td><td></td></tr>"; }).join("") +
    "</tbody></table></section>" +
    "<section><div class='label'>Attitude: travel solid, thrust dashed</div><canvas id='gauge'></canvas></section>" +
    "<section><div class='label'>" + (computerCount > 1 ? "Flight computers" : "Flight computer") + "</div><div class='computers'>" +
    Array.from({ length: computerCount }, function (_, i) {
      return "<div class='computer' id='computer" + i + "'><span class='sq'></span>C" + i + " <span class='state'></span></div>";
    }).join("") + "</div></section>" +
    "<section><div class='label'>Events</div><div id='events'>" +
    EVENTS.map(function (e, i) { return "<button data-event='" + i + "'><span class='what'>" + esc(e.what) + "</span><span class='t'>" + e.t.toFixed(1) + " s</span></button>"; }).join("") +
    "</div></section>" +
    "<section><div class='label'>Fault</div><table class='fault'>" +
    "<tr><th>Where</th><td>" + esc(ev.function || "unknown") + "</td></tr>" +
    "<tr><th>Source</th><td>" + src + "</td></tr>" +
    "<tr><th>Operation</th><td>" + esc(ev.kind || "?") + ", op " + ev.op_id + ", from occurrence " + ev.occurrence + "</td></tr>" +
    "<tr><th>Bit</th><td>" + ev.bit + " (" + bitRegion(ev.bit) + "), " + (ev.persistent ? "persistent" : "transient") + "</td></tr>" +
    "<tr><th>Core</th><td>" + (ev.core === null ? "?" : ev.core + ", computer " + ev.computer) + "</td></tr>" +
    "</table></section>";
  document.getElementById("trial").addEventListener("change", function () { location.hash = this.value; location.reload(); });
  document.querySelectorAll("[data-event]").forEach(function (b) {
    b.addEventListener("click", function () { tNow = EVENTS[Number(b.dataset.event)].t; scrub.value = tNow; if (playing) togglePlay(); });
  });
}

function drawGauge(c, f) {
  const cv = document.getElementById("gauge"), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h * 0.55, r = Math.min(w / 2 - 20, h * 0.5);
  g.strokeStyle = "#2a2f36"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(cx - r - 10, cy); g.lineTo(cx + r + 10, cy); g.stroke();
  g.beginPath(); g.moveTo(cx, cy - r - 4); g.lineTo(cx, cy + r * 0.6); g.stroke();
  g.fillStyle = "#8f959e"; g.font = "10px -apple-system, Helvetica, Arial, sans-serif";
  g.textAlign = "right"; g.fillText("travel", cx + r + 10, cy - 4);
  g.textAlign = "center"; g.fillText("up", cx, cy - r - 8);
  function arrow(deg, color, dashed) {
    if (deg === null) return;
    const a = deg * Math.PI / 180, x = cx + r * Math.sin(a), y = cy - r * Math.cos(a);
    g.strokeStyle = color; g.lineWidth = 2; g.setLineDash(dashed ? [5, 4] : []);
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.stroke();
    g.setLineDash([]); g.fillStyle = color;
    g.beginPath(); g.arc(x, y, 3.5, 0, 2 * Math.PI); g.fill();
  }
  [[c, "#3987e5"], [f, "#d95926"]].forEach(function (pair) {
    const s = pair[0];
    if (s.angle !== null) arrow(90 + s.angle, pair[1], false);
    if (s.tilt !== null && s.throttle !== null && s.throttle > 0) arrow(s.tilt, pair[1], true);
  });
}

function updatePanel() {
  const c = sampleAt(clean.samples, tNow), f = sampleAt(faulty.samples, tNow);
  ROWS.forEach(function (r) {
    const key = r[0], k = r[4] || 1, row = document.getElementById("row-" + key);
    const a = c[key] === null ? null : c[key] * k, b = f[key] === null ? null : f[key] * k;
    const d = a === null || b === null || c.ended || f.ended ? null : b - a;
    row.cells[1].textContent = c.ended ? "landed" : a === null ? "n/a" : a.toFixed(r[2]);
    row.cells[2].textContent = f.ended ? "ended" : b === null ? "n/a" : b.toFixed(r[2]);
    row.cells[3].textContent = d === null ? "" : (d > 0 ? "+" : "") + d.toFixed(r[2]);
    row.classList.toggle("diverged", d !== null && Math.abs(d) > r[3] * k);
  });
  for (let i = 0; i < computerCount; ++i) {
    const on = !!(f.computers & (1 << i)), el = document.getElementById("computer" + i);
    el.classList.toggle("off", !on);
    el.querySelector(".state").textContent = computerCount > 1 ? (on ? "trusted" : "silenced") : "flying";
  }
  document.querySelectorAll("[data-event]").forEach(function (b) {
    const past = EVENTS[Number(b.dataset.event)].t <= tNow + 1e-9;
    b.classList.toggle("past", past); b.classList.toggle("future", !past);
  });
  drawGauge(c, f);
}

const p0 = clean.samples[0].position;
function downrange(p) { return R * Math.atan2(norm(cross(p, p0)), dot(p, p0)) / 1000; }
function series(samples, f) { return samples.map(function (s) { const v = f(s); return v === null || !isFinite(v) ? null : v; }); }
function symlog(v) { return Math.sign(v) * Math.log10(1 + Math.abs(v)); }
const runs = [
  { s: clean.samples, color: "#3987e5", width: 1.5 },
  { s: faulty.samples, color: "#d95926", width: 1.5 },
];
runs.forEach(function (r) {
  r.t = r.s.map(function (s) { return s.t; });
  r.dr = series(r.s, function (s) { return finite(s.position) ? downrange(s.position) : null; });
  r.alt = series(r.s, function (s) { return s.altitude === null ? null : s.altitude / 1000; });
  r.vs = series(r.s, function (s) { return s.vertical_speed === null ? null : symlog(s.vertical_speed); });
  r.hs = series(r.s, function (s) { return s.horizontal_speed === null ? null : symlog(s.horizontal_speed); });
});
function extent(arrays, lo, hi) {
  arrays.forEach(function (a) { a.forEach(function (v) { if (v !== null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
  return [lo, hi];
}

function Chart(id, cfg) {
  this.canvas = document.getElementById(id);
  this.cfg = cfg;
  this.cache = document.createElement("canvas");
}
Chart.prototype.resize = function () {
  const dpr = window.devicePixelRatio || 1, c = this.canvas;
  this.w = c.clientWidth; this.h = c.clientHeight;
  c.width = this.cache.width = Math.round(this.w * dpr);
  c.height = this.cache.height = Math.round(this.h * dpr);
  this.dpr = dpr;
  this.box = { l: 52, r: this.w - (this.cfg.right ? 40 : 14), t: 26, b: this.h - 28 };
  const g = this.cache.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  this.drawStatic(g);
};
Chart.prototype.x = function (v) { const b = this.box, x = this.cfg.x; return b.l + (v - x[0]) / (x[1] - x[0]) * (b.r - b.l); };
Chart.prototype.y = function (v, axis) { const b = this.box, y = axis || this.cfg.y; return b.b - (v - y[0]) / (y[1] - y[0]) * (b.b - b.t); };
Chart.prototype.drawStatic = function (g) {
  const b = this.box, cfg = this.cfg, self = this;
  g.fillStyle = "#111316"; g.fillRect(0, 0, this.w, this.h);
  g.font = "11px -apple-system, Helvetica, Arial, sans-serif";
  g.strokeStyle = "#22262c"; g.fillStyle = "#8f959e"; g.lineWidth = 1;
  cfg.xTicks.forEach(function (v) {
    const x = self.x(v);
    g.beginPath(); g.moveTo(x, b.t); g.lineTo(x, b.b); g.stroke();
    g.textAlign = "center"; g.fillText(cfg.xFmt(v), x, b.b + 14);
  });
  cfg.yTicks.forEach(function (v) {
    const y = self.y(v);
    g.beginPath(); g.moveTo(b.l, y); g.lineTo(b.r, y); g.stroke();
    g.textAlign = "right"; g.fillText(cfg.yFmt(v), b.l - 6, y + 4);
  });
  if (cfg.right) {
    cfg.right.ticks.forEach(function (v) { g.textAlign = "left"; g.fillText(v.toFixed(1), b.r + 6, self.y(v, cfg.right.range) + 4); });
  }
  g.textAlign = "left"; g.fillStyle = "#e3e4e7"; g.fillText(cfg.title, b.l, 15);
  g.textAlign = "right"; g.fillStyle = "#8f959e"; g.fillText(cfg.xLabel, b.r, this.h - 3);
  g.save();
  g.beginPath(); g.rect(b.l, b.t, b.r - b.l, b.b - b.t); g.clip();
  cfg.lines.forEach(function (ln) {
    g.strokeStyle = ln.color; g.lineWidth = ln.width; g.setLineDash(ln.dash || []);
    g.beginPath();
    let pen = false;
    for (let i = 0; i < ln.xs.length; ++i) {
      const xv = ln.xs[i], yv = ln.ys[i];
      if (xv === null || yv === null) { pen = false; continue; }
      const x = self.x(xv), y = self.y(yv, ln.axis);
      if (pen) g.lineTo(x, y); else g.moveTo(x, y);
      pen = true;
    }
    g.stroke();
  });
  g.restore();
  g.setLineDash([]);
};
Chart.prototype.draw = function (cursor) {
  const g = this.canvas.getContext("2d"), b = this.box, self = this;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(this.cache, 0, 0);
  g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  if (cursor.x !== null && isFinite(cursor.x)) {
    const x = Math.min(b.r, Math.max(b.l, this.x(cursor.x)));
    g.strokeStyle = "#c9ccd1"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, b.t); g.lineTo(x, b.b); g.stroke();
  }
  (cursor.dots || []).forEach(function (d) {
    if (d.x === null || d.y === null) return;
    g.fillStyle = d.color;
    g.beginPath(); g.arc(self.x(d.x), self.y(d.y), 3.5, 0, 2 * Math.PI); g.fill();
  });
};

function ticks(lo, hi, n) {
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 5, 10].map(function (m) { return m * mag; }).find(function (s) { return s >= step0; });
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}

const drX = extent(runs.map(function (r) { return r.dr; }), 0, 1);
const altY = extent(runs.map(function (r) { return r.alt; }), 0, 1);
altY[1] *= 1.05;
const chartAlt = new Chart("chartAlt", {
  title: "Altitude (km) vs downrange", xLabel: "downrange (km)",
  x: drX, y: altY, xTicks: ticks(drX[0], drX[1], 6), yTicks: ticks(altY[0], altY[1], 4),
  xFmt: function (v) { return v.toFixed(0); }, yFmt: function (v) { return v.toFixed(v < 10 ? 1 : 0); },
  lines: runs.map(function (r) { return { xs: r.dr, ys: r.alt, color: r.color, width: r.width }; }),
});
const spY = extent(runs.map(function (r) { return r.vs.concat(r.hs); }), 0, 1);
spY[0] = Math.min(spY[0], 0); spY[1] = Math.max(spY[1], 3.3);
const symTicks = [-1000, -100, -10, 0, 10, 100, 1000, 10000].map(symlog).filter(function (v) { return v >= spY[0] && v <= spY[1]; });
const tAxis = [0, tMax];
const lines2 = [];
runs.forEach(function (r) {
  lines2.push({ xs: r.t, ys: r.vs, color: r.color, width: 1.5 });
  lines2.push({ xs: r.t, ys: r.hs, color: r.color, width: 1.5, dash: [7, 4] });
});
const chartSpeed = new Chart("chartSpeed", {
  title: "Speed (m/s, symlog scale): vertical solid, horizontal dashed", xLabel: "time (s)",
  x: tAxis, y: spY, xTicks: ticks(0, tMax, 6), yTicks: symTicks,
  xFmt: function (v) { return v.toFixed(0); },
  yFmt: function (v) { const a = Math.round(Math.pow(10, Math.abs(v)) - 1); return String(Math.sign(v) * a); },
  lines: lines2,
});

function interp(r, key, t) {
  const at = locate(r.s, t), a = r[key][at.i], b = r[key][Math.min(at.i + 1, r.s.length - 1)];
  return a === null || b === null ? null : a + (b - a) * at.f;
}

const scrub = document.getElementById("scrub"), readout = document.getElementById("readout"), playBtn = document.getElementById("play");
scrub.max = tMax.toFixed(1);
scrub.addEventListener("input", function () { tNow = Number(scrub.value); });
function togglePlay() {
  if (!playing && tNow >= tMax) tNow = 0;
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
}
playBtn.addEventListener("click", togglePlay);
window.addEventListener("keydown", function (e) {
  if (e.code === "Space" && e.target.tagName !== "SELECT") { e.preventDefault(); togglePlay(); }
});

function resize() {
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  chartAlt.resize();
  chartSpeed.resize();
}
window.addEventListener("resize", resize);

let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000;
  last = now;
  if (playing) {
    tNow = Math.min(tMax, tNow + dt * Number(document.getElementById("rate").value));
    if (tNow >= tMax) togglePlay();
    scrub.value = tNow;
  }
  readout.textContent = "t = " + tNow.toFixed(1) + " s / " + tMax.toFixed(1) + " s";
  placeMarker(cleanMarker, clean.samples, cleanPts, tNow);
  placeMarker(faultyMarker, faulty.samples, faultyPts, tNow);
  markers.forEach(function (m) { m.scale.setScalar(Math.max(0.5, camera.position.distanceTo(m.position) * 0.008)); });
  updatePanel();
  const c = runs[0], f = runs[1];
  chartAlt.draw({ x: interp(c, "dr", tNow), dots: [
    { x: interp(c, "dr", tNow), y: interp(c, "alt", tNow), color: "#3987e5" },
    { x: interp(f, "dr", tNow), y: interp(f, "alt", tNow), color: "#d95926" },
  ] });
  chartSpeed.draw({ x: tNow });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

buildPanel();
buildPaths();
resize();
setView("overview");
if (hash[1] !== undefined) { tNow = Math.min(tMax, Number(hash[1]) || 0); scrub.value = tNow; }
if (hash[2]) setView(hash[2]);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
